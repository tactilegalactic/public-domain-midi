name: Release library
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check release version
        run: node -e 'const p = require("./package.json"); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag and package version differ")'
      - run: npm test
      - run: mkdir release
      - run: npm pack --pack-destination release
      - name: Describe and checksum package
        run: node scripts/release-notes.mjs
      - name: Publish versioned package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file release/notes.md
